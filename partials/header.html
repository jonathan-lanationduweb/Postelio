<!-- SOURCE DE VÉRITÉ de la navbar (composant unique, deux variantes).
     Ne modifiez PAS les <header> des pages à la main :
     1. éditez ce fichier ;
     2. lancez :  node tools/sync-header.mjs
     Le script remplace le <header class="site-header …"> de chaque page,
     choisit la variante (overlay sur index.html, light ailleurs) et pose
     aria-current="page" sur le lien actif.
     En WordPress, ce fragment deviendra header.php (variante via body_class). -->
<header class="site-header site-header--{{variant}}">
  <div class="header-inner">
    <a class="logo" href="index.html" aria-label="Postelio, retour à l'accueil">
      <span class="logo-mark" aria-hidden="true">P</span>
      <span class="logo-text">Postelio</span>
    </a>
    <nav class="main-nav" id="main-nav" aria-label="Navigation principale">
      <ul class="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="offres.html">Offres d'emploi</a></li>
        <li><a href="entreprises.html">Entreprises</a></li>
        <li><a href="savoir-faire.html">Savoir-faire &amp; Avis</a></li>
        <li><a href="blog.html">Conseils</a></li>
        <li><a href="a-propos.html">Qui sommes-nous</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <!-- Zone compte : cloche + avatar (connecté) ou boutons (visiteur).
         Placée HORS de .main-nav pour rester visible dans la barre sur mobile,
         à côté du burger. navigation.js réécrit son contenu selon la session. -->
    <div class="nav-actions" id="account-nav" data-account-nav>
      <a href="connexion.html" class="btn btn-ghost account-guest">Se connecter</a>
      <a href="inscription.html" class="btn btn-primary account-guest">Créer un compte</a>
    </div>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Ouvrir le menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
