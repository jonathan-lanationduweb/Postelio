<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test isolé — scroll ↔ vidéo</title>
<style>
  html, body { margin: 0; background: #10231d; }
  .spacer { height: 400vh; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #hud {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    background: rgba(0,0,0,.82); color: #6f6;
    font: 13px/1.5 monospace; padding: 8px 12px; border-radius: 6px;
    white-space: pre; pointer-events: none;
  }
  #hud b { color: #fd6; }
</style>
</head>
<body>
<div id="hud">chargement…</div>
<div class="spacer">
  <div class="stage">
    <video id="v" muted playsinline preload="auto"></video>
  </div>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var file = params.get("v") || "postelio-scroll-journey";
  var v = document.getElementById("v");
  var hud = document.getElementById("hud");
  v.src = "assets/videos/" + file + ".mp4";

  var dur = 0, targetT = 0, dispT = 0, ready = false, seeks = 0;
  var LERP = parseFloat(params.get("lerp") || "0.18");
  var THRESH = parseFloat(params.get("thresh") || "0.015");

  v.addEventListener("loadedmetadata", function () { dur = v.duration; ready = true; });

  function onScroll() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    targetT = p * dur;
  }
  window.addEventListener("scroll", onScroll, { passive: true });

  /* Mesure du fps rAF (main-thread) : s'il chute pendant le scrub, le thread
     est bloqué (décodage/paint). Et dropped frames = décodage en difficulté. */
  var last = performance.now(), frames = 0, acc = 0, fps = 0;
  var minFps = 999, scrubbing = false, scrubTimer = null;

  function loop(now) {
    var dt = now - last; last = now; frames++; acc += dt;
    if (acc >= 400) { fps = Math.round(1000 * frames / acc); frames = 0; acc = 0;
      if (scrubbing && fps < minFps) { minFps = fps; } }

    var diff = targetT - dispT;
    if (Math.abs(diff) < 0.0005) { dispT = targetT; }
    else { dispT += diff * LERP; }

    if (ready && v.readyState >= 2 && Math.abs(v.currentTime - dispT) > THRESH) {
      try { v.currentTime = dispT; seeks++; } catch (e) {}
    }

    var q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : { totalVideoFrames: 0, droppedVideoFrames: 0 };
    hud.textContent =
      "fichier: " + file + " (" + (dur ? dur.toFixed(1) + "s" : "?") + ")\n" +
      "fps rAF: " + fps + "   min pendant scrub: " + (minFps === 999 ? "-" : minFps) + "\n" +
      "currentTime: " + v.currentTime.toFixed(3) + "  /  cible " + targetT.toFixed(3) + "\n" +
      "écart: " + Math.abs(v.currentTime - dispT).toFixed(3) + "   seeks: " + seeks + "\n" +
      "frames décodées: " + q.totalVideoFrames + "   perdues: " + q.droppedVideoFrames + "\n" +
      "lerp: " + LERP + "  thresh: " + THRESH;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* marque les phases de scrub pour le min-fps */
  window.addEventListener("scroll", function () {
    scrubbing = true; clearTimeout(scrubTimer);
    scrubTimer = setTimeout(function () { scrubbing = false; }, 300);
  }, { passive: true });

  /* API de test : window.__reset() remet le min-fps */
  window.__reset = function () { minFps = 999; seeks = 0; };
</script>
</body>
</html>
